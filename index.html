<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Apporteur d'affaires pour artisans. Nous finançons et qualifions les demandes de chantiers, puis les transmettons à un seul artisan. 15 % sur devis signé." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Agence Celexia | Apport d'affaires pour artisans" />
    <meta property="og:description" content="Apporteur d'affaires pour artisans. Nous finançons et qualifions les demandes de chantiers, puis les transmettons à un seul artisan. 15 % sur devis signé." />
    <meta property="og:url" content="https://agencecelexia.fr/" />
    <meta property="og:image" content="https://agencecelexia.fr/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Agence Celexia" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Agence Celexia | Apport d'affaires pour artisans" />
    <meta name="twitter:description" content="Apporteur d'affaires pour artisans. Nous finançons et qualifions les demandes de chantiers, puis les transmettons à un seul artisan. 15 % sur devis signé." />
    <meta name="twitter:image" content="https://agencecelexia.fr/og-image.png" />

    <!-- Manifest for PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Title par défaut -->
    <title>Agence Celexia | Apport d'affaires pour artisans</title>
    <link rel="canonical" href="https://agencecelexia.fr/" />
    <link rel="alternate" href="https://agencecelexia.fr/" hreflang="fr-fr" />
    <link rel="alternate" href="https://agencecelexia.fr/" hreflang="x-default" />

    <!-- Police self-hostée : aucune origine tierce, aucun blocage du rendu.
         Le sous-ensemble latin couvre le français ; latin-ext ne se charge
         qu'en cas de besoin via son unicode-range. -->
    <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Marque le document comme « JavaScript actif », avant tout rendu.
         Les animations d'apparition ne se déclenchent que sous cette classe :
         sans JavaScript, le contenu reste visible au lieu de rester à opacité 0,
         ce qui compte pour les moteurs et pour les visiteurs en cas d'échec de chargement. -->
    <script>document.documentElement.classList.add('js')</script>

    <!-- Google Analytics 4 - Consent Mode v2 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VLJ5E084ES"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'wait_for_update': 500
      });
      gtag('js', new Date());
      gtag('config', 'G-VLJ5E084ES', { 'anonymize_ip': true });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
