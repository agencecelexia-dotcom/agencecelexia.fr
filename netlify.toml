# Configuration Netlify
[build]
  command = "npm run build"
  publish = "dist"

# ---------------------------------------------------------------------------
# Redirections 301
#
# ⚠️ Ces règles doivent rester alignées avec vercel.json (le site est déployé
# sur les deux) et avec src/lib/legacyRoutes.js (filet de sécurité côté client).
# ---------------------------------------------------------------------------

# Anciennes URLs génériques
[[redirects]]
  from = "/privacy-policy"
  to = "/politique-confidentialite"
  status = 301

[[redirects]]
  from = "/terms-and-conditions"
  to = "/mentions-legales"
  status = 301

[[redirects]]
  from = "/contact-3625"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/banque-alimentaire"
  to = "/"
  status = 301

# Anciennes pages de prestation (modèle abandonné) → accueil
[[redirects]]
  from = "/services/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/sites-artisans"
  to = "/"
  status = 301

# Prise de rendez-vous supprimée : la conversion unique est l'inscription en ligne
[[redirects]]
  from = "/reserver"
  to = "/"
  status = 301

[[redirects]]
  from = "/demo-call"
  to = "/"
  status = 301

[[redirects]]
  from = "/onboarding-call"
  to = "/"
  status = 301

# Métiers retirés lors du recentrage sur 4 métiers.
