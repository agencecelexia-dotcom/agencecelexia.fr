# 410 Gone - URLs parasites d'un ancien builder
[[redirects]]
  from = "/tmp/*"
  to = "/index.html"
  status = 410

# Repli SPA - doit rester en dernier
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
